<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="title description">
  <title id="title">Irozz</title>
  <desc id="description">Creator, developer and storyteller. Signal online from irozz.space.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b0d"/>
      <stop offset="0.52" stop-color="#21151c"/>
      <stop offset="1" stop-color="#100d12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ff8aa8"/>
      <stop offset="1" stop-color="#a68cff"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="280" rx="16" fill="url(#bg)"/>
  <rect width="900" height="280" rx="16" fill="url(#grid)"/>
  <rect x="1" y="1" width="898" height="278" rx="15" fill="none" stroke="#6d4455"/>

  <g opacity=".55">
    <path d="M0 46H900M0 232H900" stroke="#a35b70"/>
    <path d="M667 46V232" stroke="#a35b70"/>
  </g>

  <circle cx="28" cy="24" r="5" fill="#ff6b88"/>
  <circle cx="47" cy="24" r="5" fill="#e7b866"/>
  <circle cx="66" cy="24" r="5" fill="#72d69b"/>
  <text x="86" y="29" fill="#8c7f85" font-family="monospace" font-size="12">irozz.space // profile.exe</text>
  <text x="780" y="29" fill="#72d69b" font-family="monospace" font-size="12">● ONLINE</text>

  <g transform="translate(44 77)">
    <text x="0" y="25" fill="#9c8d94" font-family="monospace" font-size="15">&gt; initializing creative chaos...</text>
    <text x="0" y="103" fill="url(#accent)" filter="url(#glow)" font-family="Arial Black, Arial, sans-serif" font-size="79" font-weight="900" letter-spacing="-5">IROZZ</text>
    <text x="4" y="137" fill="#ddd4d8" font-family="monospace" font-size="15" letter-spacing="2">CREATOR • DEVELOPER • STORYTELLER</text>
  </g>

  <g transform="translate(700 82)" fill="none" stroke-linecap="square">
    <rect width="154" height="118" rx="8" fill="#151117" stroke="#644152"/>
    <path d="M22 25h35v35H22zm47 0h22v22H69zm34 0h29v29h-29zM22 72h22v22H22zm34-1h35v35H56zm47-5h29v29h-29z" stroke="#a35b70" stroke-width="6"/>
    <path d="M25 28h29v29H25zm81 0h23v23h-23zM59 74h29v29H59z" stroke="#ff8aa8" stroke-width="2"/>
  </g>

  <text x="44" y="258" fill="#7e7077" font-family="monospace" font-size="12">CRIAR • PUBLICAR • RECOMEÇAR</text>
  <text x="855" y="258" text-anchor="end" fill="#7e7077" font-family="monospace" font-size="12">BR // 2026</text>
</svg>
